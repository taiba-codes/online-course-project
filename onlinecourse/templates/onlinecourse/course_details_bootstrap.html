<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.name }}</title>
    <!-- Bootstrap CDN Link -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <!-- Navbar / Header -->
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Online Course App</span>
        </div>
    </nav>

    <!-- Main Container with Bootstrap Styling -->
    <div class="container mt-5">
        <div class="jumbotron">
            <h1 class="display-4">{{ course.name }}</h1>
            <p class="lead">{{ course.description }}</p>
        </div>

        <hr class="my-4">

        <h2 class="mb-4">Lessons</h2>
        
        <!-- Lessons List using Bootstrap List Group and Cards -->
        <div class="list-group">
            {% for lesson in course.lesson_set.all %}
                <div class="list-group-item list-group-item-action flex-column align-items-start mb-2 shadow-sm">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1 text-primary">{{ lesson.title }}</h5>
                    </div>
                </div>
            {% empty %}
                <p class="text-muted">No lessons available for this course yet.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
